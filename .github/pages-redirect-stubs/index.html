<!doctype html>
<!--
  GitHub Pages redirect stub (Story 18.9). The site moved to https://cardiapp.eu/
  GitHub Pages cannot send an HTTP redirect for a project page, so this page forwards with an
  instant meta refresh (which Google treats as permanent), names the new URL as canonical, and
  carries a plain link for when the refresh is blocked. Published by .github/workflows/site-deploy.yml.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì has moved</title>
    <meta http-equiv="refresh" content="0; url=https://cardiapp.eu/" />
    <link rel="canonical" href="https://cardiapp.eu/" />
  </head>
  <body>
    <p>This page has moved to <a href="https://cardiapp.eu/">https://cardiapp.eu/</a>.</p>
  </body>
</html>
