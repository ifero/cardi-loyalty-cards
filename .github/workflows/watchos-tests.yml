name: CI — watchOS tests

on:
  # Lets a maintainer re-measure the job duration on demand when re-tuning
  # timeout-minutes, without pushing a throwaway commit to a trigger path.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'targets/watch/**'
      # The generator's INPUTS, not just its outputs. Without these two, a PR that adds
      # a brand and forgets `yarn watch:catalogue:generate` touches only
      # `catalogue/italy.json` and the widget's imageset — so this workflow would never
      # run and the drift check would never fire, which is the exact failure that check
      # exists to catch. It cannot live in the always-on quality-gates job either: that
      # runs on ubuntu and `check:catalogue-generated` needs `xcrun swift`. (The Wear OS
      # twin is pure Node, which is why it sits in the always-on job instead — see the
      # comment beside `wear:catalogue:check` in ci-quality-gates.yml.)
      - 'catalogue/**'
      - 'targets/watch-widget/**'
      # The widget's and watch app's colour pins read the tokens, so a token-only PR must run them.
      - 'tokens/color.json'
      - 'shared/theme/tokens.generated.ts'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      # The Expo config plugins. This is the only workflow that runs an iOS `expo prebuild`
      # (+ `xcodebuild`) on a PULL REQUEST, so it is the only PRE-MERGE gate that executes an
      # iOS mod at all: the release and nightly workflows prebuild for iOS only after merge, and
      # `phone-wear-module-tests.yml` prebuilds on PRs but `--platform android`.
      # `plugins/with-watch-accent-color.js` writes a build setting onto both watchOS targets and
      # throws when it matches none — a prebuild-time failure no Node-only gate can reach.
      - 'plugins/**'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'
  push:
    branches: [main]
    paths:
      - 'targets/watch/**'
      # Generator inputs too — see the pull_request filter above for why.
      - 'catalogue/**'
      - 'targets/watch-widget/**'
      - 'tokens/color.json'
      - 'shared/theme/tokens.generated.ts'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      # Config plugins too — see the pull_request filter above for why.
      - 'plugins/**'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One run per ref, newest wins. `github.ref` is `refs/heads/main` for merges and
# `refs/pull/N/merge` for PRs, so a PR can only ever cancel its own earlier run.
# This job holds a macOS runner for ~20 minutes, so superseded runs are the
# single most expensive thing in the pipeline: merging three PRs back-to-back
# used to leave three builds racing when only the tip commit's result matters.
# Cancelling is safe here — the job builds and asserts, it publishes nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchos-tests:
    name: watchOS (xcodebuild) tests
    runs-on: macos-latest
    # Ruby's `Encoding.default_external` follows the locale, and an unset LANG makes it
    # US-ASCII. The generated `project.pbxproj` stopped being pure ASCII when the app was
    # renamed (Story 21.1): `@bacons/apple-targets` writes the watch target's display name
    # as `INFOPLIST_KEY_CFBundleDisplayName = "Cardì"`. The `xcodeproj` gem then reads it
    # byte-by-byte as US-ASCII and raises `invalid byte sequence in US-ASCII` — which takes
    # out BOTH `pod install` (via `expo prebuild`) and every fastlane action that opens the
    # project (`increment_build_number`, `update_code_signing_settings`). Reproduced locally
    # with LANG unset; setting it is the documented CocoaPods remedy and is a no-op where the
    # runner already sets a UTF-8 locale.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    # The scheme's dependency graph is now narrowed, so the ceiling that used to
    # need 50m does not any more. `watch:build:ci` builds the watch targets via
    # `-project … -target watch` instead of `-workspace … -scheme watch`.
    # Measured on the first green run after that change (30637151382), not
    # estimated: the xcodebuild step went 18m47s → 45s, the whole job 21m55s →
    # 4m53s. 20m leaves ~4x headroom while still catching a genuine hang.
    #
    # Budget against `expo prebuild --clean`, not the build. Prebuild is now the
    # dominant step at 2m34s — 53% of the job — and by far the most variable:
    # the identical step took 1m08s on the run before this change. The build no
    # longer moves the total; prebuild and the runner draw do.
    #
    # Why -target and not -scheme: no shared `watch` scheme exists (only
    # Cardi.xcscheme is shared), so xcodebuild autocreates one — and
    # autocreation adds the container app. That dragged in the whole iOS Pod
    # tree (Sentry, ZXingObjC, libwebp, SDWebImage, RNSVG, RNReanimated, …) for
    # ~17m of every run. The real target graph runs the other way round
    # (Cardi → watch → watchwidget) and the watch targets declare no
    # pods of their own, so none of it was ever an input to this check.
    #
    # -sdk watchsimulator is load-bearing: in -target mode xcodebuild otherwise
    # defaults to the iOS SDK and fails the watch targets on provisioning.
    # (Not to be confused with -sdk iphonesimulator on the *app* build, which
    # breaks the watch widget.) If a targets/*/pods.rb ever appears, these
    # targets gain CocoaPods deps and this must go back through the workspace.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode (latest stable for iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          # See ci-quality-gates.yml — bump the sdk55 salt when the dep tree
          # changes shape so a stale node_modules from a prior SDK is not
          # restored via restore-keys.
          key: ${{ runner.os }}-yarn-sdk55-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-sdk55-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run watchOS catalogue generation tests (Jest)
        run: npx jest --testPathPattern='targets/watch/__tests__' --testPathIgnorePatterns='/node_modules/' --no-coverage
        env:
          CI: true

      # MUST run before anything regenerates. This step used to sit AFTER a plain
      # `generate-catalogue.swift` run, so it compared freshly generated output
      # against output generated moments earlier and could never fail — a
      # contributor who edited catalogue/italy.json or a logo PNG without
      # regenerating got a green board and shipped a stale catalogue. Against the
      # pristine checkout it compares committed vs. regenerated, which is the gate.
      # (`watch:build:ci` regenerates via its own `pre` hook, so the build below
      # still gets fresh output regardless.)
      - name: Check generated watchOS catalogue is in sync with its sources
        run: yarn check:catalogue-generated
        env:
          CI: true

      - name: Generate iOS project with watch target
        run: npx expo prebuild --clean --platform ios

      - name: Build watchOS target (xcodebuild)
        run: yarn watch:build:ci
        env:
          CI: true
