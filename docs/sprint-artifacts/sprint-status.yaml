      5. 21-4 is a LIVE DRIFT BUG, not a stale icon: `colors.xml` claims to match
         `adaptiveIcon.backgroundColor` and does not (`#FFFFFFFF` vs `#181824`).
      6. 21-6's blast radius is 20 distinct production files, not 13 — ten of them read
