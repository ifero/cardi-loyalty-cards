  21-2-migrate-colour-tokens-to-ink-and-beam: done # READY FOR REVIEW 2026-09-16. PICKED UP 2026-09-16 (wave_1). Delivered the big bang: PRIMARY_COLORS and SEMANTIC_COLORS DELETED (zero consumers each; the Google-Blue ramp has no Cardi successor), `onPrimary` ADDED, and every theme role now derived from IDENTITY_COLORS. Two findings the refinement did not have: (1) beam is NOT usable as a light-mode foreground -- 1.33:1 on cream, 1.52:1 on white -- so `warning` is ink in light and beam in dark, and the two FIXED dark surfaces that read theme tokens (NoCodeFoundBanner, the ScannerOverlay scan line) had to stop, or they go invisible in light; (2) SIX production sites paint a hardcoded white label on `theme.primary`, which dark mode turns into white-on-beam at 1.52:1 -- all repointed at `onPrimary`. A FIFTH drifting literal (`#40404A`, CardTile's dark black-brand outline) was found in the same statement as one of AC8's four. Design system amended twice: the deep-blue `secondary` role RETIRED (contradicted by Forbidden AND by the barcode section's neutral-surround rule; the two prompts citing it cite it only to rule it out), and the card-accent detail-field exemption written down. AC14 decided, not swept: 15px body floor PLUS a named chrome tier (Inter 12-14) -- the 80 literal / 40 file and 25 indirect / 12 file figures were re-measured and both confirmed; the EDIT stays with 21-6. REFINED 2026-09-14. Big bang; the KEYSTONE — Epic 22 depends on it (22-8's AC cites it; 22-1's tonal layers are palette-derived). Refinement corrected three epic figures: 57 brands with 44 DISTINCT colours - 45 literal strings, `#ffffff` vs `#FFFFFF` (not "~45 brands"); sub-15px is 80 instances/40 files (not 70) plus 25 indirect via TYPOGRAPHY tokens; and the "nine styling items" are enumerated NOWHERE — only ~6 are identifiable, so AC10 requires the list or drops the count. Found two gaps the epic omits: `shared/theme/sync-tokens.ts` (13 hand-authored pairs carrying banned oranges/greens, ou