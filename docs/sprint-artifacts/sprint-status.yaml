  21-4-wear-os-launcher-icons: done # READY FOR REVIEW 2026-09-19. PICKED UP 2026-09-19 (wave_2). The four mipmaps now come out of the one geometry definition and `icons:check` goes 14 -> 22. ⛔ AC4 DECIDED: monochrome ADDED, and as a SEPARATE generated asset, so it is EIGHT artefacts where AC7 said four — `AdaptiveIconDrawable.getMonochrome()` promises only that callers CAN tint, so an untinted draw is within contract and untinted the colour foreground shows a YELLOW beam, which is two colours and not a monochrome icon; measured, the choice is free under a tinting launcher because the two files’ alpha channels are BYTE-IDENTICAL and only RGB differs. ⚠️ THE STALE CLAIM IS IN THREE PLACES, not the two AC8 names — `app/lint.xml` carries the same "asset that does not exist" line, so fixing only the README would leave the repo arguing with itself; `MonochromeLauncherIcon` is now SATISFIED rather than suppressed (lint reports only two AndroidGradlePluginVersion notices). ⚠️ `--` IS ILLEGAL INSIDE AN XML COMMENT and `aapt2` is the ONLY gate that says so — prettier has no parser for `res/*.xml` and nothing else reads it, so a malformed comment is invisible until a Gradle build that is not on the phone’s critical path. ✅ NO WEAR SCALE NEEDED, measured not assumed: the phone’s x0.873 puts the INKED bounding circle at 64.55dp worst-case (hdpi) against the 66dp max logo size and the 72dp masked viewport. ⚠️ THE MASK IS CIRCULAR ON THE SQUARE DEVICE TOO — AC6 reads as though square gives a square mask; it does not, the mask is a launcher property, so what the square AVD verifies is layout and density selection, not a second mask. ⛔ NO THEMED-ICON SUPPORT FOUND IN THE WEAR LAUNCHER, measured on Wear OS 5 at ifero’s direction (android-34 image pulled for it): `ClockworkSysUiGoogle.apk` — confirmed by `dumpsys window` to be the package drawing the grid, not inferred from its name — references getForeground, getBackground, loadIcon and AdaptiveIconDrawable and contains ZERO references to getMonochrome; framework method names are the one thing R8 cannot rename, and positive controls prove the scan works. ⚠️ NOT A CLOSED PROOF and the docs say so: a dex scan cannot rule out theming applied platform-side behind `loadIcon()`, and it covers ONE build (5.0.1.627519173, the system image copy) rather than third-party launchers or Wear OS 6/7. So the layer is inert on Wear OS 5 too, for a DIFFERENT reason than on Wear OS 3: not API level, launcher behaviour. It ships anyway for reasons that do not depend on Wear reading it (lint gate, phone parity, ~7 KB), and every place it is declared now says so. The mark itself IS verified on the Wear OS 5 GRID launcher at a 96px slot: 41.5px of foreground against a 47.9px masked circle, 13% to spare. ✅ AC6 CAPTURES ARE COMMITTED at docs/design/wear-launcher-verification/, departing from 21-3 which described its own — a story arguing that uncheckable claims are worthless should not settle its visual acceptance with the words “verified”. PREVIOUSLY: REFINED 2026-09-14. Refinement found a LIVE DRIFT BUG, not just a stale icon: watch-android/app/src/main/res/values/colors.xml declares ic_launcher_background #FFFFFFFF with a comment claiming it matches app.json — app.json is now #181824 (changed by the rebrand f293c7f), so the comment is a lie. Two watch-android/README.md claims are also stale (the monochrome asset it says does not exist now does). ⚠️ Does NOT depend on 21-2: adaptiveIcon.backgroundColor is already #181824. Shares scripts/build-brand-icons.mjs with 21-3 (additive collision, trivial rebase).
  21-5-store-artwork: done # READY FOR REVIEW 2026-09-21. PICKED UP 2026-09-21 (wave_3). `assets/store/` is now GENERATED, GATED and TESTED; `icons:check` goes 22 -> 27. ⛔ AC5 IS NOT DONE and must not be counted as done — three blockers, all verified, written up in `docs/design/wear-store-screenshots/README.md`: (1) `watch-android/app/build.gradle.kts` carries no release `signingConfig` because the keystore is @ifero's, so `assembleRelease` yields an UNSIGNED APK `adb install` refuses; (2) R8 strips the seeder behind `BuildConfig.DEBUG`, so a release build has NO cards and the Data Layer needs a same-signed paired phone, i.e. (1) again; (3) ⚠️ THE WEAR PALETTE IS KNOWINGLY STALE AND 23-3 OWNS IT — `CarbonTheme.kt` marks `BrandPrimaryDark = #4DA3FF` (the phone's pre-rebrand dark primary) and `FavoriteStarTint = #F59E0B` (an orange the Cardi system bans BY NAME) as stale, left in place because "moving it needs the emulator pass 23.3 carries", and `23-3-wear-os-implementation` is still `backlog`. Capturing today would bake the blue chip and the banned orange star into a store listing 23-3 invalidates, and would swap an asset that ANNOUNCES itself as a placeholder for one that merely looks finished. ⚠️ COMPOSITION REWORKED 2026-09-22 after ifero reviewed the artwork ("this looks pretty basic") — and he was right: the first draft was a centred wordmark over five flat accent tiles, which is a picture of a LOGO rather than of what the app does, and Google's own guidance warns against "prominent branding duplicating your app icon". Both banners are now a fanned WALLET: three accent cards tilted behind one white card carrying a barcode, wordmark left of centre. ⛔ THE IDEA CAME FROM STITCH AND ITS EXECUTION COULD NOT SHIP, which is the reusable lesson: Stitch (project `Cardì`, screen `91c9090e...`) drew an ACUTE accent — `Cardí`, a different word — while its own prose claimed "tilted high-left to descending-right", and it also floated the accent off its stem, substituted the typeface, put a glow on the card and returned a 2560x2048 DESKTOP canvas with the banner letterboxed inside (the same defect the file it replaces had). `generate_variants` then timed out and wrote NOTHING, so there is one artefact, not four. Treat its prose about its own output as unverified until the pixels are checked. ⚠️ ITS DESIGN SYSTEM IN THAT PROJECT IS ALSO STALE (`assets/484682383639656270`): still carries deep blue `#0C3C84` as "secondary structure only", the role 21-2 RETIRED on 2026-09-16, and a Material-generated colour block rather than Ink & Beam. New test: NOTHING may overlay the barcode, swept over the bars' own region plus a quiet zone rather than the card's rect — the card's rounded corners legitimately show the fan through them, and sweeping the rect failed on exactly that. ⚠️ TASK 1 FOUND TWO DEFECTS THE REFINEMENT DID NOT PREDICT, by opening the files: the 1024x500 raster showed the wordmark CLIPPED by the artwork beside it and letterboxed inside transparent bands (and carried an alpha channel the feature-graphic slot forbids), and the `-alpha` icon was a TRANSPARENT export — the mark's stem is WHITE, so Play would have composited white bars onto its own white surface and shown an empty tile. ⛔ AC1's PARENTHETICAL IS HALF WRONG and the implementation departs from it on Google's published spec: "opaque = colour type 2" holds, "transparent = type 6" does not. Google specifies "Format: 32-bit PNG" AND "pick a background colour ... that doesn't include any transparency. Transparent assets will display the background colour of Google Play UI", so BOTH icons are opaque full-bleed ink and differ only in colour type; `-alpha` is the one to upload. ⚠️ AC3's FILE WAS RENAMED `.jpg` -> `.png`: Play accepts "JPEG or 24-bit PNG (no alpha)" for both banner slots, and on flat colour PNG is smaller AND better (87 KB vs 365 KB, no chroma subsampling to ring the wordmark) — it also avoids adding a baseline JPEG encoder to write a worse image. Nothing referenced the old name; the generator deletes it on build and fails `--check` if it returns. ⚠️ AC9's POINTER LEADS TO AN EXPLORATION SHEET: `brand_lockup.py` draws SIX candidate accents. The locked one is `mark_locked.py` — single 12-unit stem + CONTAINED `LEN_WORD = 24` accent, NOT the icon's `LEN_MARK = 52`. `Card` is Space Grotesk Bold v2.000 converted to OUTLINES (URL + sha256 in the module; no font file committed, that is 21-6), and the extracted metrics REPRODUCE the design system's em geometry exactly — drawn `x` = 49.6, `d` = 70.0, `r`'s shoulder on `STEM_TOP`. ⚠️ THE STORY'S TESTING NOTE IS WRONG: PRETTIER HAS NO `.svg` PARSER, so `yarn format:check` never reads the banner source — `test/store-artwork.test.ts` (17 cases against Play's published spec and the Forbidden list) is what does, including a GRAVE-vs-acute assertion measured in the PIXELS. ✅ AC4 needed no iOS change, verified not assumed: `app.json` has no `ios.icon` override so the App Store 1024 comes from the already-generated `assets/icon.png`, and `ios/` is gitignored. The six GitHub Pages placeholder frames DID still carry pre-rebrand `#1A73E8` and were repainted (scope agreed with ifero). ⛔ THE APP HAS NEVER BEEN PUBLICLY RELEASED, raised by ifero 2026-09-25 and corroborated before acting (`docs/index.html` renders "Coming soon on the App Store" / "Coming soon on Google Play" in BOTH locales). The first draft of AC7's Promotional Text read "New name, same wallet: myLoyaltyCards is now Cardi" — which announces a rename to an install base that does not exist and leads a first-time browser with a name they have never seen. Both locales now lead with the watch differentiator instead; the error was contained to those two fields and nothing else in the copy referenced the old name. ⚠️ THE SAME FALSE PREMISE IS IN 21-1's GUARDRAIL, quoted in 21-5's Dev Notes: "the listing keeps its reviews, ratings and install base" — there are none. Its CONCLUSION still stands (the bundle id binds an internal-testing listing