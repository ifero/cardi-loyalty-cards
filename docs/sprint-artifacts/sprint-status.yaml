         may break on the non-ASCII grave. Its AC1 is now a spike that must run first.
      3. 21-5's central AC is UNSATISFIABLE as written — there is no `fastlane/metadata/` and no
         `eas.json`, and every `skip_upload_*` flag is set, so store listing text is a console task
         no file change can make and no CI check can verify.
      4. 21-3's premise is wrong twice: the watch `AccentColor.colorset` files are EMPTY stubs
