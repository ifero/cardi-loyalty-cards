  16-26-hold-watch-display-luminance: done # 2026-08-02: raised by ifero — "most of the checkout scanners don't recognise the barcodes from the apple watch"; first of two requested fixes ("increase luminosity to 100% when showing barcode"). ⚠️ CANNOT BE BUILT AS WORDED: watchOS exposes NO public brightness API. The phone's parity implementation, useBrightness (features/cards/hooks/useBrightness.ts, Story 2.5), wraps expo-brightness → UIScreen.brightness, and UIScreen DOES NOT EXIST on watchOS; WKInterfaceDevice has no brightness property. VERIFIED by grep across targets/ — zero hits for brightness, ExtendedRuntime or isLuminanceReduced, so BarcodeFlashView does nothing about luminance today. Story 10-4's research note already recorded the same gap from the Wear OS side ("add brightness maximisation + keep-awake — parity with the phone's useBrightness, which watchOS lacks entirely"). SCOPE DECIDED 2026-08-02 by ifero: deliver keep-awake + anti-dim, no user-facing hint copy (rejected the "one-time hint" variant, so no new locale keys in en.lproj/it.lproj). ⚠️ AC1 IS A REAL FORK, NOT A FORMALITY: WKExtendedRuntimeSession requires a WKBackgroundModes entry in targets/watch/Info.plist, and the permitted values (self-care, mindfulness, physical-therapy, alarm, workout-processing, location) do not describe a loyalty barcode — claiming one is App-Review risk and must NOT be shipped on a guess. If AC1 rules it out, the story still closes on the AC3 fallback (observe @Environment(\.isLuminanceReduced), hold maximum contrast while reduced). Insertion points identified: start in the existing .task(id: card.id) at BarcodeFlashView.swift:104 (already does focus + haptic + the Story 9.6 usage event), tear down in .onDisappear at :139 next to the focus reset. Must not disturb tap-dismiss (:43) or the single-shot crown latch (:93-100). The 15s-vs-70s system Wake Duration setting is app-wide and deliberately OUT of scope — documented in findings only. NATIVE → NOT OTA-eligible. Conflict watch: 16-27 also edits BarcodeFlashView.swift but in the layout region, not the lifecycle blocks — parallel-safe with a trivial rebase.
  16-27-fix-watch-barcode-geometry: done # 2026-08-02: raised by ifero alongside 16-26 — second requested fix ("try to reduce the margins to use as much space as possible"). INVESTIGATION REFRAMED THE ASK: margins are NOT the bottleneck. WatchPresentationLayout.swift:57-58 already sets outer padding to 0 and :59 sets inner to 2, so the reclaim available there is ~2.5% of width. THE ACTUAL DEFECT IS MODULE QUANTISATION — the same mechanism Story 16-23 measured and proved. BarcodeGenerator.renderCGImage (:313-364) disables antialiasing (:335) and snaps every module boundary with Int(round(acc)) (:342, :349-350); because the module width is not an integer, 1-module elements render at TWO DIFFERENT WIDTHS. Squeezed further by quietZoneModules: 10 per side (:74) — measured in MODULES, so it costs a fixed 17.4% of width (EAN-13 = 95 modules but 115 units). COMPUTED FROM SOURCE at boxInnerPadding 2 and @2x: 40mm 316px → 2.75 px/module (2 or 3 px, 1.50× spread); 41mm 344px → 2.99; 44mm 360px → 3.13; 45mm 388px → 3.37; 46mm 408px → 3.55 (3 or 4 px, 1.33×). 16-23 pinned the PENNY failure at ≈2.83 px/module where "a 1-module element must round to 2 or 3px — a 50% error", so A 40mm WATCH RENDERS EAN-13 WORSE THAN THE ARTWORK THAT COULD NOT BE SCANNED. ⚠️ NOTE THE MAGNIFICATION IS NOT THE PRIMARY FAULT: at ≈9.5 px/mm, 2.75px ≈ 0.29mm ≈ 88% of EAN-13's nominal 0.33mm, inside the permitted 80–200% band. IT IS THE VARIANCE, NOT THE SIZE. FIX: integer-snap (module = floor(availablePx / totalUnits), centre the remainder), per-symbology quiet zones (EAN-13 is 11 leading + 7 trailing = 18, not the current symmetric 20; Code128 is 10 each side), per-symbol unit counts (a 13-digit Code128 is ≈123 modules vs EAN-13's 95, so ≈24% wider), and a ≥80% magnification floor that REFUSES rather than draws. ORIENTATION DECIDED 2026-08-02 by ifero — "rotate only when it's needed": horizontal stays the default, 90° rotation is the fallback the geometry forces (long axis 197–251pt vs short axis 162–208pt = 20–25% more), threshold COMPUTED not hardcoded. NICE RESULT: dropping boxInnerPadding 2 → 0 gives a 41mm watch 352px against the 345px that 3px/module needs, so ifero's margin-trim request is EXACTLY what keeps a 41mm horizontal. ⚠️ THE px/module FIGURES ARE DERIVED FROM SOURCE, NOT MEASURED ON HARDWARE — unlike 16-22's and 16-23's numbers; the device pass is what converts them to evidence. Bump BarcodeGenerator's cacheVersion (currently "watch-barcode-v2", :27) — the cache key includes target size (:45) but not the renderer version, so devices would serve stale pre-fix images. QR path untouched (2D, different failure mode): keeps its square-fit branch + 112pt floor (WatchPresentationLayout.swift:66-71) and the phone-pre-rendered barcodeImageBase64 fast path (BarcodeFlashView.swift:118-124). NATIVE → NOT OTA-eligible. Shares BarcodeGenerator.swift with 16-28 and BarcodeFlashView.swift with 16-26. Story 10-4 plans to port WatchBarcodeLayoutMetrics.make to Wear OS and should inherit the FIXED maths. ⚠️ AMENDED 2026-08-02 AFTER AN ADVANCED-ELICITATION PASS (assumption audit + map-is-not-the-territory + boundary sweep) — THREE CORRECTIONS, ONE OF WHICH KILLED AN AC: (1) THE PIXEL DENSITY WAS WRONG. Drafted at ≈9.5 px/mm; Apple Watch is ≈326 ppi ≈ 12.8 px/mm (cross-checked: 41mm = 352x430 px over a 904 mm² display → 12.9), so 1px ≈ 0.078mm and every physical-size claim was off by a third. Consequence: an integer snap gives 3px = 0.234mm = 71% or 4px = 0.312mm = 95% of the EAN-13 nominal 0.33mm, and the ISO 15420 80% floor needs 115x4 = 460px — which NO watch has on its short axis and only 45/46/49mm have on the long axis. (2) SO THE ORIGINAL AC2 ("never render below 80% magnification… must be refused rather than drawn") WOULD HAVE BLANKED THE BARCODE ON MOST OF THE SUPPORTED LINE-UP. Rewritten to "maximise the integer module, record the magnification achieved, NEVER refuse to draw" — the 80% floor is a PRINT spec calibrated for ink spread on paper read by laser at distance, and an emissive high-contrast screen read at 10cm is a different regime (which is why scanning off phone screens works at sizes print rejects). Uniformity and contrast are the levers; SIZE IS NOT. (3) 16-23's 2.83 px/module threshold is VISION-SPECIFIC and must NOT be quoted as governing a checkout scanner — POS lanes run Datalogic/Zebra firmware on an analog reflectance waveform, far more tolerant than Vision. The MECHANISM transfers (integer snapping makes physically unequal bars; every 1D decoder normalises against the narrow element), the NUMBER does not. ALSO FOUND, now ACs: ⚠️ A SEAM BUG THAT WOULD HAVE SILENTLY DEFEATED THE WHOLE FIX — updateBarcodeTargetSize rounds the target DOWN (BarcodeFlashView.swift:146-149) while the .frame() at :40 uses the UNROUNDED layout.barcodeSize, so SwiftUI rescales by a fraction of a pixel and .interpolation(.none) resolves it by DUPLICATING A PIXEL COLUMN, reintroducing the exact ±1px jitter the story exists to remove (now AC7). THE QR PATH ALREADY IMPLEMENTS THE FIX — renderQRCodeImage does floor(min(widthPx/extent, heightPx/extent)) and centres (:392-395, :425-431), so this is a consistency fix with a working in-repo precedent, not a new design (now cited in AC1). THE NAV BAR IS EATING THE ROTATION BUDGET — :102 sets .navigationTitle and the GeometryReader does not ignore safe area, so the title bar consumes exactly the long-axis height rotation depends on; hiding it is the cheapest space win and the most literal answer to ifero's original "use as much space as possible" (now AC6). Rotation predicate must be STABLE (hysteresis or a non-oscillating input) or a fractional geometry wobble flips orientation mid-view (AC3). Boundaries now defined rather than discovered in the field: oversized Code128 (a 20-char alphanumeric is ≈250 modules, illegible at any orientation), short payloads (EAN-8 is 67 modules — GROW the module, do not leave the space blank), and the hardcoded 156x88 barcodeTargetSize default at :13 which makes the first render wrong-sized and, once rotation exists, visibly flips on appear (AC9). AC10 records the rotation ASSUMPTION under test: flatbed lanes (Datalogic Magellan, Zebra MP7000) are omnidirectional and do not care, but a SINGLE-LINE HANDHELD LASER DOES — if the field contradicts AC3, the predicate is what changes. ⚠️ THE px/module TABLE ALSO ASSUMES geometry.size.width ≈ full screen width, which the safe area and the nav bar make OPTIMISTIC — treat it as a LOWER BOUND on the problem and re-measure on device as the first implementation task.
  16-28-watch-real-symbologies-ean8-upca-code39: done # 2026-08-02: NOT a field report — found while investigating ifero's watch-scannability complaint, and WRITTEN DOWN AT IFERO'S EXPLICIT REQUEST ("we need to write it down otherwise it gets lost"). DEFECT: BarcodeGenerator.swift:57-59 maps three of the six supported formats onto a fourth — `case .EAN8, .UPCA, .CODE39: modules = encodeCode128(value: value)`, commented "pragmatic fallback: render as Code128 so scanners can still read it". Introduced 2026-02-16 in 1d6cf7f and unchanged since. The watch draws a VALID Code128 SYMBOL CARRYING THE RIGHT DIGITS UNDER THE WRONG SYMBOLOGY: a POS lane expecting EAN-8 with Code128 disabled for loyalty rejects it outright, and one that accepts it reports a different symbology identifier than the same card scanned off the plastic. This is a direct, concrete cause of "the checkout scanner doesn't recognise the barcodes from the apple watch". The file's own doc comment concedes it — "Supports EAN-13, Code128, and QR" (:37-38) — while the enum advertises six (:15-22). ⚠️ CORRECTS A STALE CLAIM IN THIS TRACKER: story 10-4's note says these formats "fall through leaving `modules` nil and generateImage returns nil", so "an EAN-8 card shows NOTHING on Apple Watch today". That was true BEFORE 1d6cf7f; current behaviour is the Code128 substitution, which is harder to notice and arguably worse. WORK: real encoders for EAN-8 (8 digits, own check-digit weighting), UPC-A (12 digits — NOT EAN-13-with-leading-zero at the module level, even though it decodes as such) and Code39 (alphanumeric, `*` delimiters, different module structure), each following encodeEAN13's existing contract of returning nil on checksum mismatch (:95-107) so a corrupt payload fails visibly. nil must fall back to the existing value-text placeholder (BarcodeFlashView.swift:167-183) for manual keying — substituting another symbology is the defect being removed. Unit vectors from published reference symbols, not from this implementation's own output, in watch-ios/Tests/BarcodeGeneratorTests.swift. The six-format contract (core/schemas/card.ts:16-23) is a cross-platform sync contract and is NOT changed here. Wear OS (10-4) sidesteps all of this via ZXing, which covers all six natively — this closes the watchOS side of the same gap. NATIVE → NOT OTA-eligible. SEQUENCE: land 16-27 FIRST so the new encoders are written against the corrected renderer (shared file, and AC7 makes these formats inherit the integer-snap + rotation predicate). ⚠️ WATCH STORY 16-25 (map UPC-E instead of storing it as Code 128, drafted concurrently on `docs/16-25-map-upce-story`, commit 8b10f4f) — IT IS THE PHONE-SIDE SIBLING OF THIS DEFECT: a UPC-E scan is STORED with barcodeFormat CODE128 because BARCODE_FORMAT_MAP has no `upc_e` key, whereas THIS story is about correct RENDERING of formats already stored correctly. Complementary, not duplicates — but WHICH OPTION 16-25 PICKS CHANGES THIS STORY'S SCOPE: its option (a) adds UPCE to barcodeFormatSchema and would require a FOURTH encoder here; its recommended option (b) expands UPC-E to its 12-digit UPC-A parent and needs nothing extra. CONFIRM WHICH OPTION LANDED BEFORE SIZING. Note both stories independently found and corrected the same stale Story 10-4 claim about EAN8/CODE39/UPCA rendering nothing — that is corroboration, not duplication.
  16-29-watch-card-list-brand-logos: done # 2026-08-02: requested by ifero — "we should be showing the brands on the watch instead of the initials while showing the list of cards (when the brand exists)". CHEAPEST OF THE FOUR: MOST OF IT ALREADY EXISTS IN THE WRONG TARGET. The watch COMPLICATION already renders real logos — targets/watch-widget/Assets.xcassets ships 57 BrandLogo-*.imageset assets covering ALL 57 catalogue brands (verified: 57 imagesets, catalogue/italy.json has 57 brands), resolved via BrandLogoCatalog (targets/watch-widget/BrandLogoCatalog.swift) with assetName(for:) plus prefersDarkBacking(for:) for light artwork, backed by knownBrandIds/lightLogoBrandIds in Generated/BrandLogoCatalog.generated.swift. Both generated files come from watch-ios/Scripts/generate-catalogue.swift, which reads catalogue/italy.json AND the imageset folder so they cannot drift. The watch APP has none of it: targets/watch/Assets.xcassets holds only AccentColor.colorset + AppIcon.appiconset, and CardRowView.logoView (CardListView.swift:369-393) draws initials(from:) on a brand-coloured circle. SO THIS IS AN ASSET/TARGET-MEMBERSHIP PROBLEM, NOT A DESIGN PROBLEM. Target avatar is 30pt (WatchCardRowLayoutMetrics.compact, WatchPresentationLayout.swift:31) clipped to Circle() (CardListView.swift:334-335). KEEP initials on TWO paths: custom cards (brandId nil, the else branch at :381-392) AND catalogue brands with no bundled imageset — BrandLogoCatalog.normalized(_:) already gates on knownBrandIds and returns nil for unknown, so that branch is real even at 57/57 today (a brand added to italy.json without a PNG must degrade to initials, not an empty circle). Reuse prefersDarkBacking rather than re-deriving it: the row background is #1C1C1F (:359) so white-on-transparent logos would vanish. Accent bar (:329-331), favourite star (:347-352) and the combined-element accessibility label via cardRowAccessibilityKey (:283-287, :366) all UNCHANGED — the logo is decorative and must not add a second VoiceOver element. Extend generate-catalogue.swift to emit for BOTH targets rather than hand-copying 57 imagesets (watch app and widget are separate targets with separate catalogues; @bacons/apple-targets generates the project from folder layout so membership follows the files). MEASURE the watch app binary-size increase — 57 imagesets into a target that has none. ⚠️ expo prebuild REWRITES tracked files inside the watch target's asset catalogue (the AppIcon Contents.json is a known case, .prettierignore'd for exactly that reason) — confirm which files under targets/watch/Assets.xcassets are prebuild-owned before putting generated content beside them. Update the add-a-brand checklist so a future brand can't ship with a complication logo and an initials-only list row. NATIVE → NOT OTA-eligible. INDEPENDENT of 16-26/26/27 — touches CardListView.swift, the asset catalogues and the generator script, none of which those three edit; can run in parallel or ship first. Out of scope: changing logo artwork, and logos on the barcode flash screen. ⚠️ IMPLEMENTED 2026-09-03 — TWO CORRECTIONS TO THE ABOVE, both found while building it: (1) the claim that "the watch COMPLICATION already renders real logos" is FALSE. WatchComplicationWidget.swift is a static open-the-app complication and its own header says the card infrastructure (App Group snapshot, BrandLogoCatalog, WidgetCardPalette) is "retained but dormant" — the 57 imagesets ship in the widget with NO live consumer, so the card list is the FIRST live consumer of this pipeline and there was no working template to copy, only correct tested data. The chip COLOURS were therefore not "the widget's decision to reuse"; only the light/dark classification existed. (2) AC6 is NOT solved by @bacons/apple-targets' `_shared` folder: it links files into the MAIN iOS APP target (README § _shared), and the plugin writes them into membershipExceptions, which Xcode treats as EXCLUSIONS (verified against this repo's own generated project.pbxproj). Solved instead by making the generator emit the watch app's copies from the widget's single authored source, with --check comparing all of it. ALSO FIXED IN PASSING: the `check:catalogue-generated` CI step ran AFTER a write-mode generate, so the drift gate could never fail; it now runs against the pristine checkout. See the story record for the AC7 binary-size measurement (+433 KB Assets.car, +490 KB app) and the open AC9 device gate.
  16-34-fix-encodeean13-non-ascii-numeral-trap: done # 2026-09-01: reachable CRASH found while implementing 16-28. `encodeEAN13` (BarcodeGenerator.swift:109) parses digits with `value.filter { $0.isWholeNumber }.map { Int(String($0))! }`; `isWholeNumber` is true for non-ASCII numerals whose `Int(String(_:))` is nil, so the force-unwrap TRAPS — reproduced at exit 133 (SIGTRAP) for `٣901234123457`, `590123412345Ⅷ` and `㉈901234123457`. Reachable via manual card entry/paste (`core/schemas/card.ts:45` is a bare z.string(); `CardForm.tsx:42` validates only .min(1); number-pad is a soft hint). 16-28 fixed the identical defect in its two NEW encoders via `asciiDigits(of:)` but its guardrails forbade touching `encodeEAN13`. Numbered 16-34 because 16-30..16-33 are already claimed on the unmerged `docs/cardi-redesign-carry-over` branch and are invisible to this tracker. DEPENDS ON #212.
  16-35-ship-wear-os-apk-to-play: done # 2026-08-26: FIELD REPORT from ifero — "I've released to internal testers the newest app version and the wear os app hasn't been delivered." INVESTIGATED IN PARTY MODE (dev + architect) AND ACTIONED IN THE SAME PASS. NOT A REGRESSION — there is nothing to bisect: the Wear OS app has NO release or upload path and never has. beta-releases.yml has exactly two jobs (ios-testflight-beta, android-beta) and neither mentions watch-android; wear-os-build.yml runs `testDebugUnitTest assembleDebug` (DEBUG, UNSIGNED, never uploaded) and is path-filtered to watch-android/** so it does not even run on an RC tag — a green board that proves compilation and IMPLIES delivery. PROOF IS A GREP: WEAR_VERSION_CODE, the var watch-android/app/build.gradle.kts reads for its versionCode, exists in exactly two places in the repo (that build file + the README table). No workflow sets it. Epic 10 closed 2026-08-20 with the release path parked in watch-android/README.md § Signing, Play and Asset Links: "Documented here, not configured here." ⚠️ THE NAIVE FIX UN-DELIVERS THE PHONE: the Wear APK shares applicationId, so Play sees ONE app whose track release must list BOTH version codes — a second independent upload_to_play_store call creates a NEW release and the phone's code silently drops out (Story 16.7 failure class). Compounded: fastlane supply takes an APK OR an AAB, not both, and multiple AABs are unsupported; phone ships AAB, Wear ships APK. Working mechanism = second call with skip_upload_aab + version_codes_to_retain, SAME JOB (parallel jobs race the Play track edit). SCOPE CHOSEN BY IFERO (wider on both forks): fix BETA **and** PRODUCTION, and VERIFY THE SIGNING CERT. Production forces a 4th versionCode band — GITHUB_RUN_NUMBER is per-workflow-file, so both pipelines at 2_000_000+run would collide; Wear production moves to 3_000_000+run, offset declared in build.gradle.kts and applied in YAML exactly as PRODUCTION_VERSION_CODE_OFFSET already is. Signing: inject the phone keystore, then apksigner verify --print-certs and fail on a cert-SHA-256 mismatch — a wrong-key APK uploads cleanly and breaks the Wearable Data Layer SILENTLY (no crash, and Sentry has ~0 Android coverage). Also adds assembleRelease to wear-os-build.yml: R8 full mode has never run on this app and proguard-rules.pro says so in its own header. OUT OF SCOPE: Digital Asset Links publication (@ifero, Play Console), Wear store-listing assets, promoting the draft, lintDebug in CI, monochrome icon. ⚠️ AC9 IS THE REAL GATE — whether version_codes_to_retain composes with an existing DRAFT release is Play Console behaviour and CANNOT be proven from this repo; the alpha release must be confirmed to list two version codes on a real RC.
  16-36-nightly-internal-track-builds: done # DRAFTED 2026-09-03 at ifero's request ("push to the internal track (both ios and android) nightly builds, and be able to avoid builds if no CODE changes have been made; wear and watch apps needs to be delivered, so every track needs to be done"). NOT A DEFECT — new capability, and one this repo already RATIFIED: docs/architecture.md:414-426 has always specified Dev = iOS TestFlight + Android Internal Track, Trigger = push to main, Approval = none. The implementation drifted to Play's `alpha` track and the Dev trigger was never built: `grep -rn "schedule\\|cron" .github/` returns ZERO matches across all 11 workflow files, so this adds the repo's first cron. ⚠️ `paths:` FILTERS DO NOT WORK ON `schedule:` — GitHub applies them only to push/pull_request, so the "did code change?" logic (which exists TWICE already, as on.push.paths in ios-release.yml:10-45 and android-release.yml:10-42, Story 11.2's legacy) must be recomputed in-job from a git diff against a remembered baseline. Copying it in makes a THIRD divergent copy, and the two extant copies HAVE already diverged: `modules/**` is missing from both, so a change to the tracked local Expo module modules/wear-data-layer/ triggers no build today — already an OPEN Epic 10 retro action item, and the Epic 10 retro §6 explicitly parked widening as "a CI-policy change" needing its own story. This is that story. ⚠️ A NEW WORKFLOW FILE IS A FIFTH GITHUB_RUN_NUMBER COUNTER: run numbers are per-workflow-file, so nightly run 40 would compute versionCode 40 (phone) and 2_000_040 (Wear), colliding with RC run 40 on BOTH — the Story 16.7 failure class that the four-band scheme in watch-android/app/build.gradle.kts exists to prevent. Needs bands 4_000_000 (phone nightly) + 5_000_000 (Wear nightly), and WEAR_RELEASE_TRACK — binary today (anything but literal `production` maps to the beta band) — must become three-state. Consequence to document: nightly codes are HIGHER than production codes, so a device on a nightly never receives a production build as an update. ✅ DEPENDENCY DISCHARGED — PR #218 MERGED as fe0febc 2026-09-03 and this story is baselined on it: wear_play_track(phone_track) (fastlane/Fastfile:372-378) reads ENV[''WEAR_PLAY_TRACK''] and only falls back to wear:<phone_track>, and available_play_tracks lists the app''s real tracks on `Track not found`. ⛔ CORRECTED 2026-09-07 — THE SHIPPED TRACK NAME WAS WRONG AND THIS STORY FAILED ITS OWN AC12. The workflow set WEAR_PLAY_TRACK: wear:qa on the strength of developers.google.com/android-publisher/tracks, which documents the internal-testing track as `qa`. THAT DOC CONTRADICTS THE API. ✅ THIS APP''S REAL WEAR TRACK INVENTORY, read live from the Play Publishing API on 2026-09-07: wear:internal, wear:alpha, wear:beta, wear:production (plus the phone''s internal/alpha/beta/production). wear:qa DOES NOT EXIST. The 2026-09-03 inventory recorded here as confirmed came from Play Console DISPLAY NAMES, not API IDENTIFIERS. All four derive correctly, so no lane needs an override; the seam stays only for a future hand-named CLOSED track, and ensure_wear_track_exists! now validates the destination against the live list BEFORE anything is built. THIS RETIRES an earlier draft''s claim that Wear delivery was still broken on the release lanes: the derived fallback is correct for the RC lane, which needs no override. rc.21''s `Track not found: wear:alpha` was true when it happened; the track was created afterwards. The derivation is STILL not a general rule, which is why the override must stay — the phone''s `internal` has no Wear counterpart because the Wear internal track is named `qa`, and that single gap is the whole reason this story sets WEAR_PLAY_TRACK. Still unconfirmed and out of scope: wear:production for store-upload.yml (a well-known name Play provisions with the form factor, so very likely present — confirm before the next production release, not mid-upload, since that lane commits the phone AAB first). APPLE WATCH NEEDS NO NEW UPLOAD PATH and must not get one — ADR-2026-04-11-002 (docs/architecture.md:171-187): there is no standalone watchOS upload to App Store Connect or TestFlight; apply_distribution_signing already wires phone + watch + complication into every lane. iOS also needs NO new band: `ios beta` derives its build number from latest_testflight_build_number + 1, the only build number in the repo read from remote state and therefore workflow-independent. Nightly uploads are release_status `completed`, NOT the RC lane's deliberate `draft` — unattended delivery cannot require a nightly human click. AC3 makes the path definition a single source of truth with a drift guard (check:build-path-filters) in .husky/pre-push + ci-quality-gates.yml + BOTH ordered lists in CONTRIBUTING.md:272-300, per the contract at CONTRIBUTING.md:270. No FR/NFR assigned, per convention (Epic 11 carried none; 16.35 added none; FR85/NFR-M9 stay free). ⛔ AC12 WAS THE GATE AND IT FAILED — its riskiest item was the Wear track name, and the name that shipped (wear:qa) does not exist. It is no longer unprovable from the repo: ensure_wear_track_exists! reads the real inventory from Play before anything is built, and it returns wear:internal. AC13 (added 2026-09-03 at ifero''s request — "I would also like the nightly to be manually triggered too if I need to run some tests") makes workflow_dispatch a FIRST-CLASS entry point with four inputs: platform (both/ios/android, so one half can be tested without the other''s 10x macOS cost), force (default TRUE on dispatch — a manual run''s point is to build regardless, and a dispatch that silently skipped would look like a broken trigger), dry_run (build+verify everything, upload nothing — the input that makes this safe to experiment with, since a TestFlight build number and a Play versionCode are both unreusable) and ref (schedule: only ever runs the DEFAULT BRANCH''s copy of the file, so a dispatch is the only way to exercise this before it merges). ⛔ ITS HARD RULE: a dispatch must NEVER move a baseline tag — a platform:ios run knows nothing about the Android diff, a force run ships what the gate would have skipped, and a dry_run uploads nothing for a baseline to attest to. Implement as `if: github.event_name == ''schedule''` on the tag-move step: a one-event allow-list, not a chain of input checks a future fifth input could accidentally satisfy. FIRES DEC-E10-RETRO-002 (the four-sprint-parked Epic 5 generic-complication story's trigger is "when the Wear APK is published to Play").
  16-37-fix-watch-code128-stop-pattern: done # 2026-09-04: BUG REPORT from ifero, CONFIRMED BY EXECUTION not inferred. `encodeCode128`'s local `widthsTable` held "233111" at index 106 — the STOP — where Code 128 specifies "2331112". Six elements/11 modules instead of seven/13: the terminating 2-module BAR was missing, so EVERY Code128 symbol the watch has ever drawn ended on a SPACE, and a decoder matches that stop pattern to terminate the read. The shipped encoder, lifted verbatim and run under `xcrun --sdk macosx swift`, returned 121 modules for 5901234123457; BWIPP returns 123, and the two arrays are IDENTICAL up to that missing trailing 2. Four independent sources agree: BWIPP's vendored `barcode.ps` (its `code128` `encs` table has exactly 107 entries and ends `(211232) (2331112)`), bwip-js 4.10.1's `raw()`, the executed Swift, and the width formula 11 x code words + 13. ⚠️ THE DEAD ENTRIES WERE NOT HARMLESS: the table had 110 entries where code words run 0...106, and the unreachable 107-109 pushed the STOP out of the last slot, where a six-character entry stops looking wrong among six-character neighbours — which is HOW THIS HID through three stories of barcode work. A THIRD, INDEPENDENT CAUSE of "most of the checkout scanners don't recognise the barcodes from the apple watch", separate from 16-27 (quantisation) and 16-28 (wrong symbology); Code128 is the DEFAULT fallback format for manually entered cards, so its blast radius is the widest of the three. ⚠️ WHY 16-28 DID NOT CATCH IT: that story added `REFERENCE_SYMBOLS` for the three formats it INTRODUCED (EAN-8, UPC-A, Code39); Code128 was pre-existing and got none, so the executed-Swift harness never ran it. That hole is now closed — `encodeCode128` joins `HARNESS_DECLARATIONS` with 12 BWIPP reference rows spanning every code-set branch. ⚠️ READ BEFORE ADDING A REFERENCE VECTOR: Code 128's code-set switches are an OPTIMISATION, so several encodings of one text are valid and this encoder's heuristics are simpler than BWIPP's — they diverge on `A12345` (9 code words vs 8) and `CARD 12345 ABC` (same length, different set choices). BOTH STILL DECODE CORRECTLY, so they are excluded as vectors rather than treated as failures; fixing the non-minimal switching would change working symbols on a native path and is flagged out of scope. Mutation-tested three ways: restoring "233111" reddens 2 tests, re-adding the dead entries reddens the length assertion, reverting the `cacheVersion` bump reddens the cache test. `cacheVersion` v3 -> v4 (the cache key carries no renderer version, so a cached card would keep returning the short symbol). NATIVE -> NOT OTA-eligible.
  16-38-wear-os-barcode-uses-the-whole-screen: backlog # 2026-09-04: raised by ifero while reviewing 16-27 — "this is also valid for android, which I recall made the same mistake as you did by making it too narrow". CONFIRMED FROM SOURCE, not from memory: `watch-android/.../wear/barcode/BarcodeLayoutMetrics.kt` says in its own doc comment that it is "ported from watchOS's `WatchBarcodeLayoutMetrics.make`" and that "the linear `0.52`-of-height / 88-110 clamp are reproduced verbatim" — so it inherited EVERY sizing decision 16-27 has now reversed: `BOX_INNER_PADDING = 2`, `LINEAR_HEIGHT_RATIO = 0.52`, `LINEAR_MIN_HEIGHT = 88`, `LINEAR_MAX_HEIGHT = 110`. It is NARROWER STILL than watchOS was, because on a round display it additionally inscribes the whole box (title + symbol + value) in the circle via `boxW^2 + boxH^2 <= D^2`, and its own doc concedes the fill ratio can dip under 0.8 below ~181 dp diameter. WHAT 16-27 CHANGED AND WEAR SHOULD INHERIT: (1) the bar height is the WHOLE cross axis, not 52% clamped to 88-110 — bar height costs the module nothing and a taller bar is easier to intersect and aim at; (2) `boxInnerPadding` 0; (3) reclaim every safe-area edge the system does not draw into; (4) THE BIG ONE — size the module against the SYMBOL's modules, not the symbol plus its quiet zone, and let the leftover become the quiet zone split in the symbology's ratio with a guaranteed floor per side. On watchOS (4) alone took a 40 mm from 2 px/module to 3 (0.156 mm -> 0.234 mm, +50%) and a 46 mm from 3 to 4 (+33%), MEASURED on device via the DEBUG BarcodeGeometry log. ⚠️ ONE THING TO ESTABLISH BEFORE SIZING, NOT ASSUMED: Wear encodes with ZXing `MultiFormatWriter` into a `BitMatrix` at a requested pixel size (`WearBarcodeGenerator.kt`, rasterised by `BarcodeBitmap.toBarcodeImageBitmap`), so the module-quantisation half of 16-27 may already be handled by ZXing or may not be — CHECK whether ZXing's own scaling produces uniform whole-pixel modules at an arbitrary requested width before porting 16-27's integer-snap. The SIZING half (1)-(4) applies regardless. Round screens need their own answer for (3)/(4): the inscribed-circle clamp is a real constraint watchOS does not have, so "use the whole screen" is not the same instruction there. NOT OTA-eligible (native Kotlin). Independent of 16-37 (watchOS encoder table) — different platform, no shared file.
  16-39-maximise-brightness-on-card-detail: done # 2026-09-05: raised by ifero while reviewing 16-26 — "the phone card details screen needs to be fully bright, not only the full screen one". ⚠️ THIS REVERSES A SHIPPED DECISION, IT IS NOT AN OVERSIGHT: story 13-3 deliberately chose a HINT on the detail screen (AC "a brightness hint … is visible on the detail screen near the barcode area", 13-3:91) and auto-brightness ONLY in the fullscreen overlay (13-3:93). ifero reversed that on 2026-09-05. MEASURED STATE, not assumed: CardDetails.tsx does NOT call useBrightness (grep confirms the only non-test importers are FullscreenBarcode.tsx:35 and BarcodeFlash.tsx:32), so the detail screen is the ONLY barcode surface that never maximises. ⚠️ SECOND DEFECT FOUND WHILE SCOPING, wider than the report: FullscreenBarcode ALREADY CONTRADICTS ITSELF — it maximises at :52-64 AND renders the "Increase brightness for scanning" hint at :134-137. Both rows share ONE key, cards.details.brightnessHint (en.ts:634 / it.ts:635), so removing it from the detail screen alone would leave the key alive and the fullscreen contradiction standing; scope decided 2026-09-05 by ifero = remove BOTH rows + the key. ⚠️ THE IMPLEMENTATION TRAP IS THE LIFECYCLE, NOT THE API: Expo Router keeps a pushed-under screen MOUNTED, so a mount-scoped useEffect would hold the phone at 100% brightness on /card/[id]/edit and everywhere reachable from it — useFocusEffect is required, and useTrackCardUsage (Story 9.1) is the in-repo precedent. useBrightness itself is CORRECT and must NOT be modified; it is shared with two other surfaces and already tested. Activity-scoped setBrightnessAsync only — setSystemBrightnessAsync would need WRITE_SETTINGS and is banned here. JS ONLY → OTA-ELIGIBLE, unlike its watchOS sibling 16-26 (native, needs a binary; watchOS exposes no brightness API at all, which is why the two stories look nothing alike). Two existing tests assert the hint testID and will fail loudly on removal — that is the intended signal: CardDetails.test.tsx:181 and FullscreenBarcode.test.tsx:97.
  16-40-fix-unreachable-camera-error-state: done # 2026-09-14: found while implementing 16-24 — BarcodeScanner's `error && !isReady` branch cannot render (the `permission === null` branch above it swallows a REJECTED permission request, leaving the user on the loading string with no retry and no manual-entry escape). DEPENDS ON 16-24's requestCameraPermission memoisation, without which the error state oscillates. ⚠️ The component itself has no consumer — only a barrel re-export, and that barrel has zero importers; ScannerOverlay is what the app renders and is already correct.
  16-41-fix-watchos-palette-key-resolution: done # 2026-09-17: found while scoping 21-2a and deliberately kept out of it (different mechanism, visible watch behaviour change). CONFIRMED BY EXECUTING THE SHIPPED SWIFT, not by reading it. `relativeLuminance(hex:)` returns 0.0 for input it cannot parse and 0.0 is the luminance of BLACK, so its invalid-input default is the strongest possible claim rather than a neutral one. `WatchCard.colorHex` is named for a hex and carries a palette KEY — `core/watch-connectivity.ts:252` sends `colorHex: card.color` and `card.color` is a required `cardColorSchema` enum, so the field is ALWAYS a key (`test-fixtures/sync-message-v1.json:31` shows `"colorHex": "green"` on a `conad` card). Two call sites fed it straight to a hex-only helper: EVERY row on the watch drew the near-black hairline, and the amber accent got WHITE initials at 2.15:1 where black is 9.78:1 — a legibility defect that `WidgetCardPalette.prefersWhiteForeground`'s own doc comment already claimed was impossible. ⚠️ THE REPORT UNDERSTATED IT TWICE: catalogue cards ARE affected (the brand-hash fallback needs `colorHex` to be nil, which never happens — dead code), and 21-2a has NOT landed, so with the shipped palette NONE of the five keys is near-black and the hairline vanishes from every row rather than four of five. ✅ REBASED ONTO 21-2a AND OPENED FOR REVIEW 2026-09-17, after ifero's sign-off; reviewed to zero comments through a code-review and a QA loop, and verified on a 46mm simulator before and after. ⚠️ QA FOUND WHAT CODE REVIEW MISSED: the first guard pinned the two call sites READING the resolution and nothing pinned the resolution itself, so a one-line change to `resolvedAccentHex` reintroduced the whole defect with every gate green; all five row properties are now pinned whole.
  16-43-wear-ci-android-lint: done # CREATED 2026-09-20, from the QA review of Story 21.4. Android lint NEVER runs in CI for `watch-android` — `wear-os-build.yml` runs testDebugUnitTest/assembleDebug/bundleRelease and no lint* task, and `yarn lint` is eslint over .ts/.tsx only — so `MonochromeLauncherIcon`, which `app/lint.xml` leaves UNSUPPRESSED ON PURPOSE, was cleared once locally by 21.4 and is never re-verified. ⚠️ THE OBVIOUS FIX GATES NOTHING, measured not argued: there is no `lint {}` block, so `lintDebug` exits 0 with findings present (abortOnError fails on ERRORS; every finding here is a WARNING, including MonochromeLauncherIcon). Adding the task alone buys ~15s and changes no outcome — the trap watch-android/README.md § CI names in its own words, “an absent job is easily mistaken for coverage”. The fix is a TARGETED promotion to severity="fatal" (fatal not error, so `lintVitalRelease` — already in every release pipeline’s `bundleRelease` — enforces it too; `error` would have gated the CI job ALONE, which QA caught), chosen by ifero 2026-09-20 over `warningsAsErrors`. ⚠️ THE SPAWNING NOTE WAS WRONG and the correction is recorded in the story: it said adding lintDebug as-is could go red “on a day nobody touched the repo” and prescribed suppressing AndroidGradlePluginVersion first. It cannot — warnings never fail — so that check stays a harmless warning and suppressing it would be dead config; it only matters under warningsAsErrors. ⚠️ THE GAP IS NARROWER THAN “no lint in CI”: `lintVitalRelease` IS in bundleRelease’s task graph (--dry-run), so FATAL-severity lint already runs; the promoted issue now shares that same tier rather than adding one below it, and what `lintDebug` adds is the debug variant plus a signal on every PR rather than only where a release bundle is built. ⛔ HARD-SEQUENCED AFTER 21-4: main has no <monochrome> layer, so the promotion turns the Wear job RED on main until #244 merges — measured by removing the layer (reports MonochromeLauncherIcon + UnusedResources). Also corrects README § CI, which claims the workflow runs assembleRelease when it runs bundleRelease.
