  notes: |
    Committed 2026-09-14 at the Sprint 19 -> 20 roll-over, per ifero ("let's work on the new
    redesign!"). This block REPLACES the Epic 14 (Household Collaboration) sprint staged in this
    slot on 2026-08-20. Epic 14 is DISPLACED rather than deferred by one slot — Sprint 21 now
