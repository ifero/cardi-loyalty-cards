  21-1-rename-the-app-to-cardi: done # IMPLEMENTED 2026-09-16. AC1 SPIKE ANSWERED, AND THE ANSWER WAS WORSE THAN FEARED: `sanitizedName` strips `\W` BEFORE it normalises to NFD, so precomposed `ì` (U+00EC) is DELETED rather than folded — `Cardì` sanitised to `Card`, losing the letter, not just the accent. The generated project DID move, so all build references were retargeted in this story and `yarn watch:build:ci` proven green against them. ifero chose `Cardi` for the file names, delivered by normalising the name to NFD in `app.config.ts` (`resolveAppName`) — a config plugin cannot reach it, because the project directory is named at tarball-extraction time before any mod runs. TWO LEAKS the story did not anticipate, both fixed: `$(PRODUCT_NAME)` resolves to the SANITISED name so the permission prompts would have read "Allow Card to…" (AC7 anticipated the possibility), and `CFBundleName` keeps the template default because Expo registers `withDisplayName`/`withProductName` but NOT `withName`. A FIFTH SURFACE was found: `docs/` is the public GitHub Pages site — `docs/help.json` is drift-gated against the bundled help copy and went red, and `docs/privacy-policy.html` would otherwise have contradicted the in-app policy with nothing to catch it. ⚠️ THE WIDGETKIT `kind` ("MyLoyaltyCardsWatchComplication") IS A THIRD DATA-LOSING IDENTIFIER the story's table omits — renaming it blanks every configured complication. Task 9 (device verification of AC3/AC7/AC8/AC9/AC11) is NOT satisfiable from the repository. PREVIOUSLY: REFINED 2026-09-14. SCOPE WIDENED 2026-09-14 by ifero: the deep-link scheme DOES change to `cardi` (no user-facing deep link has shipped; Epic 18 is backlog). The epic's reason for freezing it was factually wrong — auth is OTP-based with NO redirectTo and the repo has no deep-link callback at all. The scheme's FIVE sites — `targets/watch/Info.plist:14` (the CFBundleURLSchemes registration, without which nothing resolves), the complication's widgetURL, the watc