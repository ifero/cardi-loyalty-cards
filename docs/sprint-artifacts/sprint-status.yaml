idget's identically-shaped table); the now-callerless `swiftColorSwitch` was removed. `CardListView.swift` never conflicted — 21-2a did not touch it, which is precisely why the defect is LIVE ON MAIN today. ⚠️ THE MERGE MADE THE INITIALS HALF MATERIALLY WORSE: `orange` is now the beam yellow `#FCCC0C`, so the white initials the buggy code paints sit at 1.52:1 where black would be 13.78:1 (it was 2.15:1 vs 9.78:1 on the old amber) — effectively illegible against WCAG AA's 4.5:1. The hairline half changed shape rather than severity: `blue` `#0C3C84` is genuinely near-black (L=0.049758), so after the fix blue KEEPS its hairline and the other four lose theirs — the table the original report predicted — while on main today all five still draw it for the original wrong reason, which is harder to spot now that one of the five looks right. ⛔ THE RISK IS RELEASE TIMING, NOT MERGE ORDER: as long as 16-41 rebases and merges BEFORE the 21-7 gate cuts the rebrand release, the fix rides the same binary and nothing broken ships. If 21-7 cuts in the window between them, that release carries a hairline on every watch row and `runtimeVersion.policy` is `appVersion`, so no OTA can correct it."
