current_sprint:
  # COMMITTED 2026-10-01 (Sprint 20 -> 21 roll-over); STAGED 2026-09-14 (Sprint 19 -> 20
  # roll-over), per ifero both times. Epic 22's Wave A — the eight illustration-free screen
  # stories, every one of them unblocked by 22-1 landing in Sprint 20. Wave sequencing is STILL
  # PROVISIONAL: the block was committed before refinement, so there was no Code Map to derive
  # file overlap from. Confirm it by FILE OVERLAP from the eight specs in the pass that approves
  # them, the way Sprint 20's waves were derived, rather than inheriting the grouping below on
  # trust.
  number: 21
  name: 'Sprint 21: Cardì Redesign — Wave A Screens (Epic 22)'
  goal: 'Implement the Cardì frames across the phone app screen by screen, now that the shared primitives exist. Deliberately NOT a big bang, and for a stated reason: unlike colour tokens, layout HAS a supported half-migrated state, so shipping a redesigned Wallet while Settings still waits costs nothing. Wave A is the illustration-free half of Epic 22 and can proceed as soon as 22-1 lands; onboarding (22-10) is not in it and stays blocked on a commissioned illustration set that does not exist.'
  status: in-progress # OPENED 2026-10-05 when 22-2 was picked up for implementation, refined and approved the same day through bmad-build with "Approve and continue", per ifero; the other seven stories are still `backlog` and refine one per run. Previously `planned`: COMMITTED 2026-10-01 at the Sprint 20 -> 21 roll-over, BEFORE its refinement gate, per ifero. Of the two gates it was staged behind, 22-1 landing is CLEARED (#252, 2026-09-28); refinement clears through `bmad-build <story-key>`, one story per run (see notes).
  planning_date: 2026-10-01
  epics: [22]
  stories:
    - 22-2-wallet
    - 22-3-card-detail
    - 22-4-barcode-flash
    - 22-5-capture
    - 22-6-the-form-pattern
    - 22-7-settings
    - 22-8-document-screens
    - 22-9-authentication
  waves:
    wave_1:
      stories: [22-2, 22-3, 22-4]
      note: 'The card surfaces — wallet, card detail, barcode flash. PROVISIONAL grouping, still unconfirmed at commit: re-derive it from the Code Map sections once the specs exist. Four rules carry over from the design system and are NOT negotiable per screen: the two-column wallet grid STAYS (replacing it with single-column rows is forbidden — it is the shipped, correct layout); NO bottom tab bar and NO floating action button (navigation stays a single Home with `+` left and gear right in the header); NOTHING is ever drawn over a barcode — no beam, no scan line, no watermark, no chrome; and branded tiles are never tinted, washed or recoloured, because the ~45 brand colours are CONTENT, not theme. 22-4 additionally keeps the barcode screen white in dark mode by design, and its surround stays neutral rather than a saturated field, which would be glare beside the scan target at maximum brightness.'
    wave_2:
      stories: [22-5, 22-6]
      note: "Capture and the form pattern. 22-5 is the one screen where the beam IS allowed — this is our scanner, not the shop's — and it consumes two of the four defects 22-1 absorbs (16-31, viewfinder shaped to the expected symbology rather than a fixed square; 16-30, scan banner not occluded by the bottom actions). 22-6 reconciles the app's TWO current form treatments into one: `AuthScreenLayout` centres its content vertically while `CardForm` is top-aligned with a trailing button and 100px of bottom padding, and neither is bottom-anchored today. Both `add-card/setup` and `card/[id]/edit` adopt the result, against the anchored footer from 22-1 — which is a flex sibling of the scroll area or an auto-top-margin anchor inside it, NEVER `position: absolute`, so it does not fight the keyboard."
    wave_3:
      stories: [22-7, 22-8, 22-9]
      note: "Settings, document screens and authentication. 22-7 needs the corrected `destructive` Button variant from 22-1 (the 16-32 defect) for its destructive actions. ⚠️ 22-8 carries a CROSS-SPRINT dependency (not the only one — 22-7 needs 22-1's `destructive` variant and 22-9 consumes `AppIconHeader` from 20-4): its body text must meet the size policy decided back in Sprint 20 — SETTLED in Sprint 20: 21-2 takes the policy DECISION and 21-6 performs the EDIT (its AC8b). Read 21-6's AC8b output for the answer; do not re-open the ownership question. 22-9 replaces the password-strength-meter green that is not in the palette, must vary width (33/66/100%) rather than relying on colour alone, and renders the Cardì mark in `AppIconHeader` — already delivered by 20-4, so it is a consumption, not a new asset."
  notes: |
    Committed 2026-10-01 at the Sprint 20 -> 21 roll-over, per ifero ("close sprint and move the
    sprint forward first"), with all twelve Sprint 20 stories done. 22-1 merged as #252 on
    2026-09-28, so the fallback below for a 22-1 slip is moot.

    COMMITTED BEFORE REFINEMENT, the reverse of Sprint 20, which was committed and refined in one
    pass (#234). The eight stories are refined after this roll-over, through
    `bmad-build <story-key>` with "Approve and stop" at its approval checkpoint, which leaves each
    spec `ready-for-dev` at docs/sprint-artifacts/stories/<key>.md and its tracker key with it.
    This is the first sprint refined under bmad-build (BMAD 6.12, #255, which removed
    create-story), so the pass is also that engine's first live run: report any drift (a spec
    outside stories/, `done` before a merge, a commit made) and fix it in
    _bmad/custom/bmad-build.toml rather than around it. Each new story is one run (the override
    writes a one-entry stories.yaml), and the run's first step needs a clean tree on a branch that
    is neither main nor a claude/... session branch, so commit each approved spec before planning
    the next or the pass halts at the second story (read from the skill, not yet seen in a live
    run). The specs' Code Maps are then the input the waves were staged without.

    NOT RE-SIZED at commit: eight, as staged. Sprint 20 delivered twelve (ten planned), so eight
    stays at the low end of observed velocity, and Sprint 20's refinement cost (ten stories in one
    create-story pass) no longer transfers: this sprint refines under a different engine, whose
    cost is unknown until its first spec is written. That is the input for any re-size.

    Staged 2026-09-14 at the Sprint 19 -> 20 roll-over, per ifero, who chose to keep the redesign
    thread running here rather than return to Epic 14 (Household Collaboration) or leave the slot
    undecided until the Sprint 20 close.

    WHY THESE EIGHT AND NOT ALL TEN. Epic 22 has ten stories. 22-1 is in Sprint 20 as the enabler
    the other nine consume. 22-10 (onboarding) is excluded because it is BLOCKED on a commissioned
    illustration set that does not exist, and the design system explicitly forbids inventing a
    per-screen illustration style to route around that — the placeholder drawings in the frames are
    references, not artwork. Illustrations must be two-colour (ink line-work plus one beam accent),
    no gradients and no third colour. The splash-adjacent brand animation, if it ever lands, lands
    in 22-10 and nowhere else: the launch surface is explicitly anti-spectacle per story 16-17, and
    onboarding is the one place where the user has already agreed to wait.

    EIGHT STORIES IS AT THE LOW END OF OBSERVED VELOCITY (Sprint 18 delivered 9, Sprint 19
    delivered 11), which is deliberate given that every one of them needs refinement first and the
    real cost of refining a redesign story will only be known once Sprint 20 has done it nine
    times. Re-size this block at the planning that commits it, using Sprint 20's actual refinement
    cost as the input rather than this estimate.

    IF 22-1 SLIPS OUT OF SPRINT 20, this block cannot be committed as written — all eight stories
    consume its primitives. The fallback in that case is to commit 22-1 plus the first wave here
    rather than to start screens against primitives that do not exist yet.

    ALTERNATIVES if priorities shift at the planning that commits this:
      - Epic 23 implementation (23-2..23-4): un-gated if 23-1 lands in Sprint 20 as planned.
        watchOS, Wear OS and the widget/complication. Real-hardware validation required on both
        platforms; rotary input on Wear OS cannot be injected headlessly.
      - Epic 14 (Household Collaboration): still needs a bmad-ux pass on 14-5a, then create-story.
      - The SDK 57 upgrade thread (16-18..16-21): un-gated since 16-17 landed; still needs
        refinement, and a risky native upgrade should not share a sprint with a store rebrand.
      - Epic 6 social sign-in (6-12 Apple / 6-13 Google): both `backlog`, but their story files
        are already at ready-for-dev depth (233 / 227 lines), so promoting them is cheap.
      - Epic 18 (share links): still blocked on the custom-domain registration, an open action
        item only ifero can discharge.

