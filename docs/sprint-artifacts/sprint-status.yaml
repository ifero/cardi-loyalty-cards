  21-3-watchos-app-and-widget-icons: done # READY FOR REVIEW 2026-09-18. PICKED UP 2026-09-18 (wave_2). Three stale watchOS surfaces now carry the Cardi mark, generated from the one geometry definition; `icons:check` goes 9 -> 14 (refinement's "rises from 8" was already stale on main). ⚠️ THE AC7 SPIKE HAS A THIRD ANSWER NEITHER OPTION ANTICIPATED, and it is measured rather than read: `icon:` IS accepted for a `watch-widget`, but `withIosIcon` branches on `type === "watch"` alone, so it would have regenerated the SAME iPhone/iPad idioms in Cardi colours — AND the appiconset never ships at all. The widget target carries no `ASSETCATALOG_COMPILER_APPICON_NAME`, so `actool` runs without `--app-icon`, and the built `watchwidget.appex` has NO `AppIcon` in its `Assets.car` and no icon key of any kind in its `Info.plist`. The fifteen #80FF80 placeholders have never reached a device, so "one of them bright green" was true of the repository and never of the product. ifero chose CONVERT over DELETE mid-implementation: one generated 1024 declaring idiom universal / platform watchos, fifteen wrong-idiom files dropped, and what remains is under `icons:check`. ⛔ AC6 AS WRITTEN IS NECESSARY AND NOT SUFFICIENT: filling both colorsets compiles beam into `Assets.car` correctly (assetutil: srgb 0.988/0.800/0.047) and changes NOTHING on screen, because `actool` writes `NSAccentColorName` only when `ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME` names a colorset and prebuild emits that setting for no target. ⚠️ AND THE BEFORE-STATE IS MISDESCRIBED IN TWO DOCUMENTS: this story and cardi-watch-grammar.md §4.5 both say `Color.accentColor` resolves to "system default blue"; sampled on a 46mm it is flat grey #808080. ifero approved the wider scope, so `plugins/with-watch-accent-color.js` names the colorset — and it MUST be listed BEFORE @bacons/apple-targets in app.json, because Expo's withMod runs the last-registered mod FIRST and the watch targets do not exist until apple-targets creates them; listed the intuitive way round it matches nothing, prebuild still succeeds and the accent silently stays grey, so the plugin throws on an empty match and a test pins the order. The colorsets stay hand-authored because apple-targets' own `colors: { $accent }` route works but hardcodes display-p3, which is not #FCCC0C on a P3 watch. A LIVE ACCENT MADE 23.1's PREDICTED DEFECT REAL: watchOS tints the navigation title and on the barcode screen that title is the CARD'S NAME — measured #FCCC0C before, #F0F0E8 after the §4.5 cream carve-out. `.tint()` DOES NOT DO IT and fails silently (the view is a navigationDestination, so the bar belongs to the stack); `toolbarForegroundStyle(_:for:)` does, and is watchOS-only per the SDK interface. ⛔ AC10 IS 3/4: home icon, accessoryCircular, accessoryCorner and accessoryRectangular verified on a 46mm (watchOS 26.4) with screenshots; accessoryInline NOT PLACED — Infograph, Modular, Modular Compact and Modular Duo all put a FIXED DATE in the slot that would host it. ⚠️ AND IT IS THE ONE FAMILY THIS STORY CANNOT AFFECT, which an earlier draft of this note got exactly backwards: `WatchComplicationWidget.swift:37-38` gives `.accessoryInline` its OWN case rendering a localised string and NO image, and Swift does not fall through without an explicit `fallthrough` (the file has none) — so it never reaches `iconImage`. This story changes artwork and the accent; that case reads neither. The wrong version said inline shared the `default:` branch and therefore the 76px image budget, which would have sent a hardware pass hunting for a clipped image on a family that draws none. ⚠️ A freshly simctl-installed watch app does NOT appear in the complication picker until the simulator is REBOOTED — that cost one wasted pass. PREVIOUSLY: REFINED 2026-09-14. Refinement corrected the epic twice, by decoding the files: AccentColor.colorset is NOT "still the pre-rebrand colour" — both watch colorsets are EMPTY stubs with no colour key; and the widget App