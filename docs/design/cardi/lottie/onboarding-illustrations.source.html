<!doctype html>
<!--
  The four Cardì onboarding drawings and their motion: the source that
  build-onboarding-lottie.py turns into assets/animations/onboarding/*.json.

  Each <template> is one drawing, the markup of the Design canvas the set was
  adopted on. The classes are the whole style system (g ground, k bars, t/m/gl
  widths, bm/bf the beam); the generator resolves them per scheme. `an` plus a
  motion class marks an animated element, and the keyframes below are the motion
  the generator restates. Change both together, then re-run the generator.

  Opened in a browser, the page shows each drawing at rest and a strip of frames
  through its motion, in light mode.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onboarding illustrations</title>
    <style>
      .il {
        fill: none;
        stroke: #181824;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
        overflow: hidden;
      }
      .il .g {
        fill: #f0f0e8;
      }
      .il .k {
        fill: #181824;
        stroke: none;
      }
      .il .t {
        stroke-width: 2;
      }
      .il .m {
        stroke-width: 2.5;
      }
      .il .gl {
        stroke-width: 2.5;
      }
      .il .st {
        stroke-width: 1.5;
        stroke-dasharray: 3 4;
      }
      .il .bm {
        stroke: #fccc0c;
        stroke-width: 4;
      }
      .il .bf {
        fill: #fccc0c;
        stroke-width: 2;
      }
      .il .dt {
        stroke-width: 2.5;
        stroke-dasharray: 0.1 7;
      }
      .il .dt6 {
        stroke-width: 2.5;
        stroke-dasharray: 0.1 6;
      }
      .il .ds {
        stroke-width: 2.5;
        stroke-dasharray: 7 6;
      }
      .il .ds5 {
        stroke-width: 2;
        stroke-dasharray: 5 5;
      }
      .an {
        animation-duration: 6s;
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      .m-loop .an {
        animation-iteration-count: infinite;
      }
      .m-once .an {
        animation-iteration-count: 1;
      }
      .m-off .an {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .an {
          animation: none !important;
        }
      }
      .w-back {
        transform-box: view-box;
        transform-origin: 140px 150px;
        transform: rotate(-19deg);
        animation-name: w-back;
      }
      .w-front {
        transform-box: view-box;
        transform-origin: 140px 150px;
        transform: rotate(15deg);
        animation-name: w-front;
      }
      .w-beam {
        animation-name: w-beam;
      }
      @keyframes w-back {
        0%,
        15% {
          transform: rotate(-2deg);
        }
        28%,
        100% {
          transform: rotate(-19deg);
        }
      }
      @keyframes w-front {
        0%,
        15% {
          transform: rotate(-2deg);
        }
        28%,
        100% {
          transform: rotate(15deg);
        }
      }
      @keyframes w-beam {
        0%,
        31.9% {
          opacity: 0;
          transform: translateY(-9px);
        }
        32% {
          opacity: 1;
          transform: translateY(-9px);
        }
        40% {
          opacity: 1;
          transform: translateY(9px);
        }
        45%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .h1-c1 {
        animation-name: h1-rise1;
      }
      .h1-c2 {
        animation-name: h1-rise2;
      }
      .h1-c3 {
        animation-name: h1-rise3;
      }
      @keyframes h1-rise1 {
        0% {
          transform: translateY(18px);
        }
        8%,
        100% {
          transform: translateY(0);
        }
      }
      @keyframes h1-rise2 {
        0%,
        2% {
          transform: translateY(18px);
        }
        10%,
        100% {
          transform: translateY(0);
        }
      }
      @keyframes h1-rise3 {
        0%,
        4% {
          transform: translateY(18px);
        }
        12%,
        100% {
          transform: translateY(0);
        }
      }
      .h1-arc {
        animation-name: h1-arc;
      }
      @keyframes h1-arc {
        0%,
        8% {
          opacity: 0;
        }
        20%,
        100% {
          opacity: 1;
        }
      }
      .h1-fly {
        animation-name: h1-fly;
      }
      @keyframes h1-fly {
        0%,
        9% {
          transform: translate(-48px, 36px);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        19% {
          transform: translate(-24px, -4px);
        }
        27%,
        100% {
          transform: translate(0, 0);
          opacity: 1;
        }
      }
      .h1-tile {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation-name: h1-tile;
      }
      @keyframes h1-tile {
        0%,
        26% {
          transform: scale(0);
        }
        31% {
          transform: scale(1.1);
        }
        35%,
        100% {
          transform: scale(1);
        }
      }
      .h2-phone {
        transform-box: view-box;
        transform-origin: 110px 54px;
        animation-name: h2-phone;
      }
      @keyframes h2-phone {
        0% {
          transform: translateY(-6px) rotate(-6deg);
        }
        12%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }
      .h2-sight {
        animation-name: h2-sight;
      }
      @keyframes h2-sight {
        0%,
        9% {
          opacity: 0;
        }
        15%,
        100% {
          opacity: 1;
        }
      }
      .h2-beam {
        animation-name: h2-beam;
      }

          opacity: 0;
          transform: translateY(-9px);

        12% {
          opacity: 1;
          transform: translateY(-9px);
        }

          opacity: 1;
          transform: translateY(-9px);
        }

          opacity: 1;
          transform: translateY(9px);

      .h2-hand {

        }
        41%,

      }
      .h3-arc {
        stroke-dasharray: 224;
        stroke-dashoffset: 0;
        animation-name: h3-arc;
      }
      @keyframes h3-arc {
        0%,
        4% {
          stroke-dashoffset: 224;
        }
        6% {
          stroke-dashoffset: 195;
        }
        12% {
          stroke-dashoffset: 157;
        }
        17% {
          stroke-dashoffset: 123;
        }
        22% {
          stroke-dashoffset: 92;
        }
        30%,
        100% {
          stroke-dashoffset: 0;
        }
      }
      .h3-card {
        transform-box: view-box;
        transform-origin: 138px 44px;
        animation-name: h3-card;
      }
      @keyframes h3-card {
        0%,
        4% {
          transform: translate(-72px, 70px) rotate(-30deg);
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        12% {
          transform: translate(-54px, 37px) rotate(-18deg);
        }
        17% {
          transform: translate(-28px, 15px) rotate(-8deg);
        }
        22%,
        100% {
          transform: translate(0, 0) rotate(0deg);
          opacity: 1;
        }
      }
      .h3-ticks {
        animation-name: h3-ticks;
      }
      @keyframes h3-ticks {
        0%,
        21% {
          opacity: 0;
        }
        27%,
        100% {
          opacity: 1;
        }
      }
      .h3-slot {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation-name: h3-slot;
      }
      @keyframes h3-slot {
        0%,
        29% {
          transform: scale(1);
        }
        32% {
          transform: scale(1.14);
        }
        37%,
        100% {
          transform: scale(1);
        }
      }
    </style>

        animation-delay: calc(var(--t) * -1s) !important;
        animation-iteration-count: 1 !important;

    </style>

    <script>

        const c = document.createElement('div');
        c.className = 'cell';
        c.style.setProperty('--t', 5.9);
        c.appendChild(document.getElementById(id).content.cloneNode(true));
        document.getElementById('rest').appendChild(c);
      }
      const times = [0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1, 2.4];
      for (const id of ['w', 'h1', 'h2', 'h3']) {
        const row = document.createElement('div');
        row.className = 'row';
        for (const t of times) {
          const c = document.createElement('div');
          c.className = 'cell';
          c.style.setProperty('--t', t);
          c.appendChild(document.getElementById(id).content.cloneNode(true));
          const l = document.createElement('div');
          l.textContent = id + ' t=' + t + 's';
          c.appendChild(l);
          row.appendChild(c);
        }
        document.getElementById('frames').appendChild(row);
